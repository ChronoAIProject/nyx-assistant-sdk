name: SDK server image
on:
  push:
    branches: [dev]
    tags: ["sdk-server-*"]
    paths: ["server/**", ".github/workflows/server-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node --test test/server.test.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: ghcr.io/chronoaiproject/nyx-assistant-sdk-server:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/ChronoAIProject/nyx-assistant-sdk
      - run: echo "ghcr.io/chronoaiproject/nyx-assistant-sdk-server:${GITHUB_SHA}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
