<!doctype html>
<html lang="{{lang}}" data-locale="{{locale}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ticketsTitle}}</title>
<style>
  :root { font: 16px/1.5 Inter, system-ui, sans-serif; color: #182325; background: #f5f6f3; }
  nyx-assistant { --nyx-accent: #295d51; --nyx-radius: 14px; }
  main { max-width: 46rem; margin: 6vh auto; padding: 1.5rem; }
  h1 { font-size: 2rem; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0 2rem; }
  th, td { border-bottom: 1px solid #becbc5; text-align: left; padding: .65rem; }
  input, select, button { padding: .55rem; font: inherit; }
  input[type=text] { width: min(25rem, 90%); }
  output { display: block; margin: 1rem 0; white-space: pre-wrap; }
</style>
<main>
  <nav aria-label="{{siteNav}}">{{languageLinks}}</nav>
  <h1>{{ticket}}</h1>
  <label>{{status}} <select id="filter"><option value="all">{{all}}</option><option value="open">{{open}}</option><option value="closed">{{closed}}</option></select></label>
  <span id="count" aria-live="polite"></span>
  <table><thead><tr><th>{{ticket}}</th><th>{{status}}</th></tr></thead><tbody id="rows"></tbody></table>
  <label><input id="readonly" type="checkbox"> {{readOnly}}</label>
</main>
<script type="module" src="/app.js"></script>
<script defer src="/nyx-widget.js" data-proxy="/"></script>
</html>
