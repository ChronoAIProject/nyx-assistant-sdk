<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NyxID 工单筛选</title>
<style>
  :root { font: 16px/1.5 Inter, system-ui, sans-serif; color: #182325; background: #f5f6f3; }
  nyx-assistant { --nyx-accent: #295d51; --nyx-radius: 14px; }
  main { max-width: 46rem; margin: 6vh auto; padding: 1.5rem; }
  h1 { font-size: 2rem; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0 2rem; }
  th, td { border-bottom: 1px solid #becbc5; text-align: left; padding: .65rem; }
  input, select, button { padding: .55rem; font: inherit; }
  input[type=text] { width: min(25rem, 90%); }
  output { display: block; margin: 1rem 0; white-space: pre-wrap; }
</style>
<main>
  <h1>工单</h1>
  <label>状态 <select id="filter"><option value="all">全部</option><option value="open">待处理</option><option value="closed">已关闭</option></select></label>
  <span id="count" aria-live="polite"></span>
  <table><thead><tr><th>工单</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table>
  <label><input id="readonly" type="checkbox"> 只读模式</label>
</main>
<script defer src="/app.js"></script>
<script defer src="/nyx-widget.js" data-proxy="/"></script>
</html>
